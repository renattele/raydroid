name: Android Release

run-name: Release build on ${{ github.ref_name }}

on:
  push:
    branches:
      - dev
      - main

permissions:
  contents: read

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-release-build:
    name: Build Android Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Android release
        run: ./gradlew :androidApp:assembleRelease -Praydroid.appleTargets.default=false --no-daemon

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: raydroid-android-release-apk-${{ github.sha }}
          path: androidApp/build/outputs/apk/release/*.apk
          if-no-files-found: error
